---
name: Build & Deploy
on:
  push:
    branches: [main]
  # Lets a deploy be re-run by hand after a failed webhook without an empty commit.
  workflow_dispatch:
permissions:
  contents: read

# Never cancel a deploy that is already publishing or calling the webhook; queue the
# next one behind it. Cancelling mid-push can leave the -latest tag on a half-pushed manifest.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  build-docker-images:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          file: provisioning/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            maelstromeous/ps2alerts:assets-${{ github.sha }}
            maelstromeous/ps2alerts:assets-latest

  deploy:
    name: Deploy
    needs: build-docker-images
    uses: ./.github/workflows/deploy-webhook.yml
    secrets: inherit
